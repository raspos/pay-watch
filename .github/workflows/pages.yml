# PAY워치 GitHub Pages 배포. 이 파일을 올려도 자동 배포되지 않는다(수동 실행 전용).
# 구조: site/(약 420MB)는 저장소 기록에 올리지 않는다(.gitignore). 로컬에서 pipeline/package_site.py 로 검증된 번들(zip+manifest)을 만들어
#       GitHub Release 자산으로 올리면, 이 워크플로가 번들을 내려받아 다시 검증한 뒤 Pages 로 배포한다. (docs/DEPLOY.md)
# 테스트 번들: pipeline/make_test_bundle.py 의 가상 소형 번들(manifest.test_bundle=true)은 같은 검증을 모두 거치지만 **Pages 에 배포하지 않고** 점검용 아티팩트로만 남긴다
#       → 파이프라인을 실제 공개 사이트를 덮어쓰지 않고 검증할 수 있다.
# 사람인 데이터: 외부 게시·재배포 권한 확인 전에는 어떤 경로로도 배포되지 않는다 — check_public(종료 코드 2) 외에 파일 존재 자체를 직접 검사하는 단계가 따로 있다.
# 사전 조건(사용자 설정): 저장소 Settings → Pages → Source = GitHub Actions. 기존 Pages 설정이 있으면 먼저 확인하고 덮어쓰지 않는다.
name: pay-watch-pages
on:
  pull_request:
    paths: ["web/**", "web_exp/**", "pipeline/**", "tests/**", "config/**", ".github/workflows/*.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "검증·배포할 번들이 올라간 Release 태그(비우면 소스 검증만). 테스트 번들 태그면 검증만 하고 배포하지 않음"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: pay-watch-pages
  cancel-in-progress: false
jobs:
  verify-source:                      # 소스·정책 검증(원자료가 없어도 통과하도록 설계). 실제 배포 직전 전체 테스트 1회를 겸한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - name: 저장소 보호 검사(생성 산출물·원자료·사람인/통합 데이터·내부 감사·대용량 파일이 커밋 대상에 없는지)
        run: python -I -X utf8 pipeline/guard_repo.py
      - name: JS 테스트(전체)
        run: node --test tests/js/*.test.mjs
      - name: Python 테스트(전체; 원자료·비공개 산출물이 필요한 테스트는 파일이 없으면 자동 건너뜀)
        run: python -I -X utf8 -m pytest -q

  bundle:                             # 번들 검증(배포 여부와 무관하게 실행). 테스트 번들은 여기까지만 간다.
    needs: verify-source
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    outputs:
      test_bundle: ${{ steps.kind.outputs.test_bundle }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: 번들 내려받기(Release 자산)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --dir bundle --pattern "manifest.json" --pattern "pay-watch-site-*.zip" --pattern "policy_manifest.json"
      - name: 번들 무결성 검증 후 site/ 로 풀기(sha256·파일 수·버전)
        run: python -I -X utf8 pipeline/verify_bundle.py bundle site
      - name: 번들 종류 판별(테스트 번들 여부)
        id: kind
        run: python -I -X utf8 -c "import json; print('test_bundle=' + str(bool(json.load(open('bundle/manifest.json', encoding='utf-8')).get('test_bundle'))).lower())" >> "$GITHUB_OUTPUT"
      - name: 업로드 전 검증 표시 확인(실제 번들은 publish_release.py 를 거친 것만 통과)
        if: steps.kind.outputs.test_bundle != 'true'
        run: python -I -X utf8 -c "import json,sys; m=json.load(open('bundle/manifest.json',encoding='utf-8')); p=m.get('preupload') or {}; ok=p.get('checked') is True and p.get('gate') in ('clean','permitted','private_storage'); print('업로드 전 검증 표시:', p); sys.exit(0 if ok else 1)"
      - name: 사람인 데이터 직접 검사(파일 존재 여부 기준; 권한 확인 전이면 여기서 중단)
        run: |
          if [ -d site/data/pay ] || [ -f site/data/finder/sm_entities.json ]; then
            if ! grep -Eq '^saramin_permission:[[:space:]]*confirmed' config/publish.yaml || [ ! -s config/saramin_permission_evidence.md ]; then
              echo "배포 차단: 번들에 사람인 데이터가 있으나 saramin_permission=confirmed 와 근거 파일(config/saramin_permission_evidence.md)이 없습니다."
              exit 1
            fi
          fi
      - name: 공개 빌드 검사(연구용 추정·내부 필드·정책)
        env:
          PAYWATCH_POLICY_MANIFEST: ${{ steps.kind.outputs.test_bundle == 'true' && 'bundle/policy_manifest.json' || 'config/public_policy_manifest.json' }}
        run: python -I -X utf8 pipeline/check_public.py
      - name: 링크·경로 점검(저장소 하위 경로 상대 주소 포함)
        run: python -I -X utf8 pipeline/check_links.py
      - name: 테스트 번들이면 점검용 아티팩트로만 남김(Pages 배포 아님)
        if: steps.kind.outputs.test_bundle == 'true'
        uses: actions/upload-artifact@v4
        with: { name: test-site, path: site, retention-days: 1 }
      - name: 실제 번들이면 Pages 아티팩트 준비
        if: steps.kind.outputs.test_bundle != 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:                             # 실제 번들일 때만. 테스트 번들은 어떤 경우에도 여기에 오지 못한다.
    needs: bundle
    if: needs.bundle.outputs.test_bundle == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
